[project]
name = "mama-eyes"
version = "0.1.0"
description = "Suivi photographique longitudinal du fond d'oeil (DMLA) - usage personnel, non diagnostique"
authors = [{ name = "pierre.jacquot" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "scikit-image>=0.24",
    "scipy>=1.13",
    "pandas>=2.2",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mama-eyes = "mama_eyes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mama_eyes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
